schema: spec-driven

context: |
  Raycast 生产路径由 Rust `mornlea_engine` 独占 DDA 遍历；internal/core 保留校验、一次归一化、64-record batch 驱动、惰性 callback 与 RayHit.Point，旧 Go DDA 只是测试 oracle，生产无 fallback。
  项目：Mornlea，一个用 Go 自研客户端与服务端的独立体素游戏，Go module 为 github.com/channing771/mornlea，不兼容官方 Minecraft 协议或存档。
  当前基线：M5D；Go 1.26；协议 v19；伙伴存档 schema v4；benchmark scenario v16；macOS/Apple Silicon 是图形与性能基准平台；GPU 渲染由 Rust `mornlea_client`（client ABI v4）独占生产；客户端默认启动内置权威服务端，也可通过 TCP 连接专用服务端。
  当前实现：已有持久世界、权威移动/交互、客户端预测、最多 8 名玩家同步、权威快捷栏、持久掉落物、固定 36 格权威背包、固定合成、确定性矿石、多人共享权威熔炉、权威计时采掘、权威单件原地丢弃、服务端权威工具耐久、损坏物品、共享箱子、权威生命值与死亡结算和确认伤害红色边缘反馈、14 种常见块状材料与缺失玩家一次性材料包、世界坐标 terrain UV、玻璃/树叶单 pass alpha cutout、无窗口 `materials-showcase`、确定性自然材料与橡树生成、材料加工闭环（橡木板配方与三条熔炼映射）、目标方块反馈和发光块固定配方、区块快照、GPU-driven 渲染、协议 v19、TCP 直连、无图形专用服务端、稳定玩家身份、玩家 schema v6 与区块 schema v8 存档、世界 metadata v2，以及服务端权威推进的 24000 tick 昼夜、客户端从权威方块镜像派生的 `0..15` 传播天空光与静态方块光和程序化方块云。M5A 继承 M4Q，M4Q 继承 M4P 固定 Rust 1.97.1 `mornlea_engine` cdylib；Rust 是 mesh/light、collision resolver、raycast 与物理 tick 积分的唯一生产实现，Go 仍拥有 app、world、sim、network、storage、render、物理 state/input/tunable/snapshot 编码、yaw 三角与 prism 构建，旧 Go 积分只作测试 oracle，只有 internal/nativeabi 接触 engine C ABI，internal/mesh 与 internal/physics 是领域调用方，且没有生产 Go fallback。发光块可放置、可用石镐或铁镐挖回，并有固定配方 4 玻璃 → 4 发光方块。M5B 在 M5A 基础上交付 AI-native 闭环：可选 `ai` 组新增 endpoint/model/apiKeyEnv/taskTimeoutMinutes（密钥只从环境变量解析、不入配置日志存档）；寻址成功进入每伙伴 16 条持久 FIFO，Planner（严格 JSON、仅 go_to）、确定性整数 A*（留 Go）与 `sim.CompanionAction` 权威移动（复用 Rust 物理出口）构成执行链，任务生命周期 ChatEvent 广播、deadline 用 WorldTimeTicks；`companions.ai` schema v2 保存任务与 FIFO（350,208 bytes 上界、v1 只读迁移）；ChatEvent 追加任务生命周期 kind 与 TaskFailReason，wire 形状与长度上限不变。M5C 在 M5B 基础上交付伙伴世界交互与持续跟随：计划步骤全集 go_to/follow/mine/place（观察快照追加在线玩家集合）；follow 是最后一步的无限期任务（4 格水平跟随距离内停止移动、deadline 豁免、目标离线按 TaskFailWorldChanged 失败）；mine 复用玩家权威计时采掘规则且完成 tick 内方块、耐久与产物三方原子（背包无空位 TaskFailInventoryFull 且不破坏方块）；place 单一权威 tick 内按玩家放置规则原子扣料写入；`@伙伴名 停止` 精确文本是唯一绕过 FIFO 的控制指令（转 Stopped 终态、广播 TaskStopped、立即执行原队首；非跟随任务只同步拒绝 NotFollowing）；协议 v18 与 `companions.ai` schema v3（任务区步骤按 kind 变长 13/15/17 bytes、430,080 bytes 上界、v2/v1 只读迁移）。M5D 在 M5C 基础上交付性格与近期记忆（旁路表达平面，事实平面零变化）：persona 内联（≤4 KiB）或 `personas/<canonical 名称>.txt` 外部文件（内联优先、磁盘镜像 Persona 与生效值 ResolvedPersona 分离，Save 不吸收外部文件）；Dialogue worker 与 Planner 输入完全隔离（人设+摘要+事实节点+环境摘要），确定性触发节点每任务 ≤8 次、共享 4 模型槽（无槽即跳过）、每伙伴 1 在途、失败只跳过台词；终态响应捎带 ≤2 KiB 摘要（只喂 Dialogue，persona 与摘要绝不进 Planner）；协议 v19 追加 CompanionSpeech（≤256 bytes 台词广播全员），客户端 `伙伴名：台词` 行呈现；schema v4 可选摘要区（438,280 bytes 上界、v3/v2/v1 只读迁移、inactive 不存摘要）。benchmark scenario 为 v16；当前唯一 benchmark 场景迁移为 `15:16`，M2 v15/M5 v14 基线保持原字节。性能数值只记录，报告完整性、真实 overflow 和数据丢失仍是门禁。TCP 仅面向可信局域网，不提供认证或加密。已交付里程碑与版本演进见 docs/notes/progress.md。docs/superpowers 中可能包含尚未实现的后续设计和计划，必须以代码与测试确认当前行为。
  入口：cmd/mornlea 是 darwin 图形客户端；cmd/mornlea-server 是无图形专用服务端，Linux amd64 canonical bundle 启用 CGO 并要求同目录 libmornlea_engine.so，binary 与动态库不可跨版本混装；cmd/gfxspike 是图形技术验证；cmd/perfcheck 比较性能基线。
  核心包：core 放端无关基础类型；companion 放端无关伙伴身份、定义与身体类型；profile 放本机稳定玩家档案；world 放世界数据模型；physics 放确定性物理状态与 snapshot 编码，积分/碰撞/裁剪调用 Rust engine；sim 放权威模拟；network 放端无关消息、登录协议和 Memory/TCP 传输；storage 放世界、玩家与伙伴存档；server 负责 Host、会话和持久化装配；client 持有只读镜像、预测、输入和消息接收；mesh/render 组成渲染路径的 CPU 半部（GPU 半部由 Rust `mornlea_client` 独占）。
  架构约束：内部包依赖必须符合 internal/archcheck/dependency_test.go 的白名单；任何 Go 包都不得 import WebGPU 绑定（archcheck 全仓禁止）；sim 不得依赖渲染；world 不得依赖 network；单机和远程模式应共享游戏逻辑。
  数据与性能约束：服务端是世界与玩家状态的唯一权威；客户端镜像只读；跨 goroutine 传递的消息在发送后视为不可变；热路径避免无界工作、意外分配和阻塞 I/O；现有性能阈值不得无理由放宽。
  工程约定：文档、测试说明和面向开发者的叙述优先使用中文，Go 标识符和既有协议术语保留英文；修改保持最小且聚焦；新增行为必须有自动化测试；不要提交二进制美术资源或 Mojang 版权资产。
  自动约束：Claude Code 与 Codex 共用 scripts/agent-hooks/guard.mjs；高风险命令、Go 格式、跨包/契约类 OpenSpec 要求和停止前验证由项目 Hook 机械执行。不得通过改 Hook、关闭 Hook 或设置豁免变量来绕过失败，除非用户明确批准该例外。
  验证：至少运行受影响包测试；跨包或并发修改运行 go test ./... -race；提交前运行 gofmt、go vet ./...、架构测试和与改动相关的基准/`perfcheck` 性能记录。只有报告结构与身份错误、真实 overflow、数据丢失和 I/O 错误仍失败。
  历史资料：docs/superpowers/specs 与 docs/superpowers/plans 是设计背景和决策记录，不是 OpenSpec 主规格；只读取与当前变更有关的部分，不批量复制。OpenSpec 主规格从真实变更归档后逐步增长。

rules:
  proposal:
    - 使用中文撰写，明确背景、目标、非目标、用户可观察结果和受影响的包或文档
    - 把变更限制为一个可独立评审、验证和回退的最小闭环
    - 明确兼容性、存档、协议、并发或性能影响；不适用时直接说明
  specs:
    - 使用中文描述可观察行为，并保留 OpenSpec 要求的英文结构标题和 SHALL/MUST 关键字
    - 每条 Requirement 至少包含一个可判定的 Given/When/Then Scenario，并覆盖重要失败路径或边界条件
    - 只写行为契约；包结构、类型选择和实现步骤放入 design.md
  design:
    - 说明数据所有权、依赖方向、并发边界以及受影响文件；不得绕过现有架构门禁
    - 涉及存档、线上协议或性能契约时，包含兼容/迁移方案、风险、回退方案和验证方法
    - 对重要取舍记录被否决的替代方案及理由
  tasks:
    - 拆成按顺序执行、可单独验证、可勾选的小任务；测试与对应实现放在同一任务组
    - 每项写明目标文件或包以及具体验证命令，避免“完成开发”一类不可判定描述
    - 收尾任务必须包含 gofmt、go vet ./...、go test ./... -race 和 OpenSpec 严格校验；平台专属或性能变更补充相应门禁

operations:
  apply:
    guidance:
      - 实现前重新读取 proposal、delta specs、design 和 tasks，以这些产物约束范围
      - 遵循 red-green-refactor，保留用户已有和无关的工作区改动，只在验证通过后勾选任务
      - 实现发现规格或设计不成立时，先同步修改对应 OpenSpec 产物，再继续编码
  archive:
    guidance:
      - 归档前确认任务状态、实现与 delta specs 一致，并运行 openspec validate --all --strict --no-interactive
      - 把可复用的行为契约合入主规格；项目级工作习惯应更新 AGENTS.md 或 openspec/config.yaml
