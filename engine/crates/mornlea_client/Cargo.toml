[package]
name = "mornlea_client"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

# 窗口栈只在 darwin 生产;其他平台此 crate 编译为空库,Linux 专服不受影响。
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
raw-window-handle = "0.6"
objc2 = "0.6"
# 渲染器:与 Go 绑定内嵌的 wgpu-native v29 同主版本线,降低跨后端行为差异。
wgpu = "29"
# wgpu 异步初始化的最小执行器。
pollster = "0.4"
