name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rust 工具链身份
        run: |
          cd engine
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Rust 格式、静态检查与单测
        run: make rust-check

      - name: 构建 Rust cdylib
        run: make rust

      - name: OpenSpec 规格门禁
        run: npx --yes @fission-ai/openspec@1.7.0 validate --all --strict --no-interactive

      - name: Agent Hooks 策略测试
        run: node --test scripts/agent-hooks/guard.test.mjs

      - name: 架构、存储与协议门禁
        run: go test ./internal/archcheck ./internal/storage ./internal/network ./internal/physics -v

      - name: 单元与端到端测试
        run: go test ./... -race -p=1 -skip '^TestScenarioV7EightSessionServerProbeIsRealAndBounded$'

      - name: 50ms 服务端探针门禁
        run: go test ./cmd/mcgo -run '^TestScenarioV7EightSessionServerProbeIsRealAndBounded$' -count=1

      - name: TCP 重启与 Memory/TCP parity 重复门禁
        run: go test ./internal/server -run 'TestTCPPlayerAndWorld|TestMemoryTCPParity' -race -count=10

      - name: M3C v6 八玩家与性能报告门禁
        run: go test ./internal/client ./internal/server ./cmd/mcgo ./cmd/perfcheck -run 'Test(PerfReportV6|ScenarioV6|PerfcheckV6|PerfcheckV5SameScenario|PerformanceThresholds|InterestObserver|HostStats|BenchmarkServerEpoch|BenchmarkServerMeasuredWindow)' -count=1

      - name: 构建无图形专用服务端
        run: |
          CGO_ENABLED=0 GOOS=linux go build ./cmd/mcgod
          test -z "$(CGO_ENABLED=0 GOOS=linux go list -deps ./cmd/mcgod | rg 'internal/(client|mesh|render|gfx)|glfw|webgpu|x/image/font')"

      - name: 静态检查
        run: |
          go vet ./...
          gofmt -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt

      - name: 微基准与平台无关阈值
        run: go test ./... -bench=. -benchtime=1x -run='^$'

      - name: M3C 多人微基准可执行性
        run: go test ./internal/network ./internal/server ./internal/render -run '^$' -bench '(RemotePlayerStateCodec|EightPlayerInterest|RemoteAvatarNameTag)' -benchmem -benchtime=100x -count=1
